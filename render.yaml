services:
  - type: web
    name: smart-bharat-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        value: https://indrajeet967.github.io
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
